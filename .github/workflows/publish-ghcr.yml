name: Semantic Release Docker

on:
  push:
    branches: [ "main" ]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write        # semantic-release pushes version commit + tag
  packages: write        # push images to ghcr.io
  issues: write          # semantic-release release comments
  pull-requests: write   # semantic-release release comments

jobs:
  semantic_release:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          docker system prune -af
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Configure Git credentials
        run: |
          git config --global user.email "plurality.web3@gmail.com"
          git config --global user.name "semantic-release-bot"

      - name: Docker Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install -g semantic-release \
            @semantic-release/git \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github \
            @semantic-release/exec

      - name: Semantic Release
        run: |
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
